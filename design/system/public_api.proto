// -----------------------------------------------------------------------------
// Common payload messages
// -----------------------------------------------------------------------------

message CharacterHP {
  uint32 character_id = 1; // CharacterID.
  uint32 current_hp = 2; // HP.
}

message BattleCharacterStatus {
  uint32 character_id = 1; // CharacterID.
  uint32 position = 2; // FormationSlotID. 0..255.
  float hp = 3;
  float attack = 4;
  float defense = 5;
  SpeedRank speed_rank = 6;
  repeated uint32 ability_id = 7; // AbilityID. Exactly 2 elements.
  uint32 main_skill_id = 8; // SkillID.
  float max_hp = 9; // 戦闘計算で使用する最大HP.
}

message TacticsStatEffectResult {
  float attack = 1;
  float defense = 2;
  float speed = 3;
}

message TacticsHpRecoveryEffectResult {
  TacticsHpRecoveryType recovery_type = 1;
  float recovery_rate = 2;
}

message TacticsBattleSpecialParameters {
  float attack = 1;
  float defense = 2;
  float speed = 3;
  float skill_activation_rate = 4;
  float max_tp = 5;
  float battle_score = 6;
  float guild_battle_score = 7;
  float castle_break_score = 8;
  float assault_castle_break_rate = 9;
  float assault_castle_break_score = 10;
  float hate = 11;
  sint32 castle_level = 12;
  uint32 bp_recovery = 13;
  uint32 tp_recovery = 14;
  float attack_count_score = 15;
  float castle_break_score_limit = 16;
  float hp_recovery_value = 17;
  float revive_rate = 18;
  float attack_target_rate = 19;
}

message TacticsBattleSpecialData {
  TacticsBattleSpecialType special_type = 1;
  TacticsBattleSpecialParameters parameters = 2;
  TacticsBattleSpecialTrigger trigger = 3;
}

message TacticsBattleSpecialEffectResult {
  TacticsBattleSpecialType special_type = 1;
  TacticsBattleSpecialParameters parameters = 2;
  TacticsBattleSpecialTrigger trigger = 3;
}

message TacticsEffectResultData {
  oneof value {
    float scalar_value = 1;
    uint32 uint_value = 2;
    TacticsStatEffectResult status_effect = 3;
    TacticsHpRecoveryEffectResult hp_recovery = 4;
    TacticsBattleSpecialEffectResult battle_special = 5;
  }
}

message TacticsEffectResult {
  TacticsEffectID tactics_effect_id = 1;
  TacticsTarget target = 2;
  TacticsEffectResultData effect_data = 3;
}

message FormationCharacterHP {
  uint32 formation_slot_id = 1; // FormationSlotID. 255 means unused.
  uint32 current_hp = 2;
}

message GuildBattleTacticsStatus {
  uint32 tactics_id = 1;
  uint32 remaining_use_count = 2;
}

message GuildBattleItemStatus {
  uint32 item_id = 1;
  uint32 remaining_count = 2;
}

message GuildBattleCbcStatus {
  bool is_active = 1;
  uint64 initiator_guild_id = 2;
  uint32 remaining_time = 3;
  uint32 remaining_count = 4;
}

message ArenaPartyCharacter {
  uint32 character_id = 1;
  uint32 position = 2; // FormationSlotID.
  repeated uint32 follower_character_id = 3; // Exactly 2 elements. Empty uses uint32 max.
  repeated uint32 ability_id = 4; // Exactly 2 elements. Empty uses uint32 max.
  uint32 main_skill_id = 5;
}

message GuildBattlePartyCharacter {
  uint32 character_id = 1; // uint32 max means unused element.
  uint32 priority_position = 2; // FormationSlotID.
  repeated uint32 follower_character_id = 3; // Exactly 2 elements. Empty uses uint32 max.
  repeated uint32 ability_id = 4; // Exactly 2 elements. Empty uses uint32 max.
  uint32 main_skill_id = 5;
}

message TacticsActiveEffectState {
  uint32 tactics_id = 1;
  TacticsEffectID effect_id = 2;
  TacticsTarget target = 3;
  float effect_value = 4;
  uint64 expires_at = 5;
  uint32 remaining_count = 6;
  TacticsBattleSpecialData battle_special = 7;
  TacticsCountConsumeTrigger count_consume_trigger = 8;
  TacticsEndType end_type = 9;
  bool erase_consumed = 10;
  uint64 source_player_id = 11; // PlayerID that activated this effect.
  uint64 source_guild_id = 12; // GuildID of the activating player at activation time.
}

message ApiErrorResponse {
  ApiErrorCode error_code = 1;
}

message RequiredOperationErrorResponse {
  ApiErrorCode error_code = 1; // API_ERROR_REQUIRED_OPERATION_FAILED.
  string message = 2; // Fixed: 必要な処理が実行できませんでした
}

// -----------------------------------------------------------------------------
// System / Account / Guild
// -----------------------------------------------------------------------------

message CreateAccountRequest {
  string login_id = 1;
  string password = 2;
  string user_name = 3;
  string discord_authorization_token = 4;
}

message CreateAccountResponse {
  uint64 player_id = 1;
}

message LoginRequest {
  string login_id = 1;
  string password = 2;
  string client_version = 3;
  string discord_authorization_token = 4;
}

message LoginResponse {
  uint64 player_id = 1;
  string access_token = 2;
}

message LoginVersionErrorResponse {
  ApiErrorCode error_code = 1; // API_ERROR_CLIENT_VERSION_MISMATCH.
  string required_version = 2;
}

message ClientVersionMismatchResponse {
  ApiErrorCode error_code = 1; // API_ERROR_CLIENT_VERSION_MISMATCH.
  string required_version = 2;
}

message RefreshAccessTokenRequest {
  // Request body is empty. RefreshToken is read from __Host-RefreshToken Cookie.
}

message RefreshAccessTokenResponse {
  string access_token = 1;
}

message LogoutRequest {
  // Request body is empty. RefreshToken is read from __Host-RefreshToken Cookie.
}

message LogoutResponse {}

message CreateGuildRequest {
  string access_token = 1;
  uint64 player_id = 2;
  string guild_name = 3;
  GuildBattleStartTime daytime_start_time = 4;
  GuildBattleStartTime nighttime_start_time = 5;
}

message CreateGuildResponse {
  uint64 guild_id = 1;
}

message ApplyGuildJoinRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;
}

message ApplyGuildJoinResponse {}

message ApproveGuildJoinApplicationRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;
  uint64 applicant_player_id = 4;
}

message ApproveGuildJoinApplicationResponse {
  uint64 guild_id = 1;
  uint64 joined_player_id = 2;
}

message SendGuildInvitationRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;
  uint64 invitee_player_id = 4;
}

message SendGuildInvitationResponse {}

message AcceptGuildInvitationRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;
}

message AcceptGuildInvitationResponse {
  uint64 guild_id = 1;
}

message LeaveGuildRequest {
  string access_token = 1;
  uint64 player_id = 2;
}

message LeaveGuildResponse {
  uint64 guild_id = 1;
}

message UpdateGuildLeadershipRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_id = 3;
  uint64 leader_player_id = 4;
  uint64 subleader_player_id = 5; // 0 means unset.
}

message UpdateGuildLeadershipResponse {
  uint64 guild_id = 1;
  uint64 leader_player_id = 2;
  uint64 subleader_player_id = 3;
}

// -----------------------------------------------------------------------------
// Arena
// -----------------------------------------------------------------------------

message UpdateArenaPartyRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint32 formation_id = 3;
  repeated ArenaPartyCharacter characters = 4; // 1..5 elements.
}

message UpdateArenaPartyResponse {}

message ArenaBattleRequest {
  string access_token = 1;
  uint64 player_id = 2;
  string client_version = 3;
  ArenaMode mode = 4;
  uint64 opponent_id = 5;
  uint32 local_formation_id = 6;
  repeated ArenaPartyCharacter local_characters = 7; // 1..5 elements.
}

message ArenaBattleResponse {
  bool own_party_matched = 1;
  uint32 own_formation_id = 2;
  repeated ArenaPartyCharacter own_characters = 3; // 1..5 elements.
  uint32 enemy_formation_id = 4;
  repeated BattleCharacterStatus enemy_characters = 5; // Up to 5 elements.
  uint64 seed = 6;
  uint64 enemy_player_id = 7; // 戦闘に使用した相手PlayerID.
}

message ArenaBattleErrorResponse {
  ArenaBattleErrorCode error_code = 1;
}

// -----------------------------------------------------------------------------
// Guild Battle
// -----------------------------------------------------------------------------

message UpdateGuildBattlePartyRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint32 formation_id = 3;
  repeated GuildBattlePartyCharacter characters = 4; // Exactly 10 elements.
}

message UpdateGuildBattlePartyResponse {}

message JoinGuildBattleRequest {
  string access_token = 1;
  uint64 player_id = 2;
  string client_version = 3;
  uint64 guild_id = 4;
  uint64 guild_battle_id = 5;
  uint32 local_formation_id = 6;
  repeated GuildBattlePartyCharacter local_characters = 7; // Exactly 10 elements.
}

message GuildBattleJoinResponse {
  bool party_matched = 1;
  uint32 server_formation_id = 2;
  repeated GuildBattlePartyCharacter server_characters = 3; // Exactly 10 elements.
  repeated FormationCharacterHP characters = 4; // Exactly 10 elements.
  uint64 request_sequence = 5;
}

message GetGuildBattleStatusRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
}

message GetGuildBattleStatusResponse {
  repeated FormationCharacterHP characters = 1; // Exactly 10 elements.
  uint32 bp = 2;
  uint32 max_bp = 3;
  uint32 tp = 4;
  uint32 max_tp = 5;
  HealState heal_state = 6;
  uint32 heal_remaining_time = 7;
  ReviveState revive_state = 8;
  uint32 revive_remaining_time = 9;
  uint32 sortie_wait_remaining_time = 10;
  repeated GuildBattleTacticsStatus tactics = 11;
  repeated TacticsActiveEffectState active_tactics_effects = 12;
  repeated GuildBattleItemStatus items = 13;
  uint64 ally_score = 14;
  uint64 enemy_score = 15;
  uint32 chain = 16;
  GuildBattleCbcStatus cbc_status = 17;
  uint64 request_sequence = 18;
}

message GuildBattleSortieRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
  repeated uint32 select_id = 5; // Exactly 5 elements. Unused slot is 255.
}

message GuildBattleCastleBreakResponse {
  uint64 score = 1;
  uint64 seed = 2;
  uint64 next_request_sequence = 3;
  GuildBattleSortieEventType event_type = 4; // NUMBERED_CASTLE_BREAK / ASSAULT_CASTLE_BREAK / CBC.
}

message GuildBattleAnnihilationResponse {
  uint64 score = 1;
  repeated BattleCharacterStatus enemy_characters = 2; // Up to 5 elements, at battle start.
  uint64 seed = 3;
  reserved 4; // 旧enemy_tactics_id. Battle Tactics snapshotへ集約.
  uint64 next_request_sequence = 5;
  repeated BattleCharacterStatus own_characters = 6; // Selected own characters at battle start, up to 5.
  uint64 enemy_player_id = 7;
  uint32 enemy_formation_id = 8;
  repeated TacticsActiveEffectState battle_tactics_effects = 9; // Only effects relevant to this battle, as at battle start.
}

// 継続中の騎士団戦参加者が開くServer -> Client通知ストリーム.
message SubscribeGuildBattleUpdatesRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
}

message GuildBattleScoreUpdate {
  uint64 guild_battle_id = 1;
  uint64 ally_score = 2; // Subscriber's guild perspective.
  uint64 enemy_score = 3;
  uint32 chain = 4; // Subscriber's guild chain.
}

message UseTacticsRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
  uint32 tactics_id = 5;
}

message UseTacticsResponse {
  uint32 tp = 1;
  uint32 remaining_count = 2;
  repeated TacticsEffectResult effects = 3;
  uint64 next_request_sequence = 4;
  uint64 seed = 5;
}

message UseItemRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
  uint32 item_id = 5;
}

message UseItemResponse {
  uint32 bp = 1;
  uint32 remaining_count = 2;
  uint64 next_request_sequence = 3;
}

message StartHealRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message StartHealResponse {
  uint32 wait_time = 1;
  uint64 next_request_sequence = 2;
}

message CancelHealRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message CancelHealResponse {
  uint64 next_request_sequence = 1;
}

message CompleteHealRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message CompleteHealResponse {
  uint32 bp = 1;
  repeated CharacterHP character_hp = 2;
  uint64 next_request_sequence = 3;
}

message StartReviveRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message StartReviveResponse {
  uint32 wait_time = 1;
  uint64 next_request_sequence = 2;
}

message CancelReviveRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message CancelReviveResponse {
  uint64 next_request_sequence = 1;
}

message CompleteReviveRequest {
  string access_token = 1;
  uint64 player_id = 2;
  uint64 guild_battle_id = 3;
  uint64 request_sequence = 4;
}

message CompleteReviveResponse {
  uint32 bp = 1;
  repeated CharacterHP character_hp = 2;
  uint64 next_request_sequence = 3;
}
