syntax = "proto3";

package game.publicapi;

// Public APIのRequest/Response Payload wire schema.
// Transportはdesign/system/network.md, 各APIの処理・成功/失敗Response選択は
// design/server/public_api.md, 論理型の範囲制約はdesign/shared/types.mdを正とする.
// 本ファイルはgRPC Service, HTTP method, HTTP pathを追加定義しない.
// repeatedで固定長を表すフィールドはコメントに記載した要素数をApplication層で検証する.

