  GUILD_BATTLE_SORTIE_EVENT_NUMBERED_CASTLE_BREAK = 1; // キリ番CB.
  GUILD_BATTLE_SORTIE_EVENT_ASSAULT_CASTLE_BREAK = 2; // 強襲CB.
  GUILD_BATTLE_SORTIE_EVENT_CBC = 3; // キャッスルブレイクチャンスによるCB.
