  TACTICS_COUNT_CONSUME_TRIGGER_ANNIHILATION_ALL_ENEMIES = 2; // 殲滅で相手を全滅させた場合に1回消費する.
  TACTICS_COUNT_CONSUME_TRIGGER_SORTIE = 3; // 出撃時に1回消費する.
}

